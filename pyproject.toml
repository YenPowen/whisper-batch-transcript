[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-video-text-v6"
version = "6.0.0"
description = "Modular Whisper media transcription desktop tool"
readme = "README_v6.md"
requires-python = ">=3.10"
dependencies = [
  "openai-whisper>=20250625",
  "opencc>=1.1.7",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "requests>=2.31",
  "modelscope>=1.11",
  "funasr>=1.1.0",
]

[tool.setuptools.packages.find]
include = ["whisper_tool*"]
